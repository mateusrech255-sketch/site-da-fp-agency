name: Static build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_API_BASE: https://api.fpagency.com.br
  SITE_BASE_PATH: /
  SITE_URL: https://www.fpagency.com.br

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        env:
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          npm run lint
          npm run test
          npm run build:cf
